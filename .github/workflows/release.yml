name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Why this exists
# ───────────────
# `@shuttering/starlight` lives on npmjs while every other `@shuttering/*` package lives
# on GitHub Packages. That split is invisible until a consumer needs both, and then it is
# unfixable on their side: `.npmrc` scope mapping is all-or-nothing —
#
#   @shuttering:registry=https://npm.pkg.github.com
#
# — and npm has no per-package registry key. A repo consuming starlight *plus* any
# GH-hosted `@shuttering` package must therefore pin starlight to a hardcoded tarball
# URL to escape the scope mapping, which has no semver range and can never float. One
# consumer is frozen at 0.2.0 for exactly this reason.
#
# So starlight publishes to both. npmjs stays the primary (it is where it has always
# been, and where its public consumers resolve it); GitHub Packages is added so the scope
# mapping resolves it like every sibling and the override can be deleted.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only credential needed for the GitHub Packages publish. No repository secret
      # is involved, which is the reason this half can be automated at all.
      packages: write
    steps:
      - uses: actions/checkout@v5
      # `actions/setup-node` primes a package-manager cache by default, and picks the
      # manager by reading `packageManager` and the lockfile — so it invokes pnpm even
      # though nothing here publishes with pnpm, and fails the job if the binary is
      # absent. Installed the same way ci.yml installs it: the two workflows have to
      # agree about how this repo is built, and switching the cache off here would
      # leave them disagreeing about it instead.
      #
      # pnpm version comes from package.json#packageManager — don't pin here or it
      # trips ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@shuttering'

      # Asked of each registry separately. The two publishes can succeed independently
      # — the npmjs half needs a repository secret the GitHub Packages half does not —
      # so a single answer for both would let one registry's success suppress the
      # other's retry, and the version would never reach it.
      - name: Which registries already have this version?
        id: check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          probe() {
            if npm view "@shuttering/starlight@$v" version --registry="$2" >/dev/null 2>&1; then
              echo "on_$1=true" >> "$GITHUB_OUTPUT"
              echo "$v is already on $2 — nothing to do."
            else
              echo "on_$1=false" >> "$GITHUB_OUTPUT"
              echo "$v is not on $2 — publishing."
            fi
          }
          probe gh https://npm.pkg.github.com
          probe npm https://registry.npmjs.org

      - name: Publish to GitHub Packages
        if: steps.check.outputs.on_gh == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `publishConfig.registry` beats the `--registry` flag on publish, so pointing
          # the CLI at GitHub Packages is not enough — the field has to be rewritten.
          # Done to a scratch copy of package.json and restored after, so the published
          # tarball still carries the npmjs registry for anyone who reads it there.
          cp package.json package.json.bak
          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.publishConfig = { registry: "https://npm.pkg.github.com" };
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          npm publish --no-git-checks || status=$?
          mv package.json.bak package.json
          exit ${status:-0}

      # npmjs stays as it is. It needs a repository secret this workflow deliberately does
      # not assume exists, and starlight has been published there by hand throughout. If
      # NPM_TOKEN is ever added, this step starts working with no other change.
      - name: Publish to npmjs
        if: steps.check.outputs.on_npm == 'false' && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --registry=https://registry.npmjs.org --no-git-checks

      # A skipped npmjs publish is the one outcome that looks like success and is not:
      # the two consumers in the estate resolve from different registries, so a version
      # that reaches only GitHub Packages strands whoever resolves from npmjs. Said out
      # loud here because the step above can only express it by not running.
      - name: Warn if npmjs was skipped
        if: steps.check.outputs.on_npm == 'false' && env.NPM_TOKEN == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="${{ steps.check.outputs.version }}"
          echo "::warning::$v was not published to npmjs — NPM_TOKEN is not set. \
          Consumers resolving @shuttering/starlight from npmjs stay on the previous \
          version until it is added and this workflow is re-run."
