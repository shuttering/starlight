# esbuild ships a prebuilt binary via a postinstall script. pnpm blocks build
# scripts by default; astro cannot start without it. Allowed by name rather than
# disabling the protection wholesale.
allowBuilds:
  esbuild: true

# pnpm withholds releases younger than its minimum release age, so a freshly
# published contract resolves to the previous version instead of failing. The
# contract check would then run against values nobody shipped. Excluded per exact
# version rather than by lowering the age, so each adoption is a reviewable line.
minimumReleaseAgeExclude:
  - '@shuttering/tokens@1.0.0'
